<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talent Roster – SkillBridge</title>
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
  <link rel="stylesheet" href="/app/css/style.css">
  <style>
    .students-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    .filter-panel {
      position: sticky;
      top: 5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .roster-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .roster-row-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: all var(--t-fast);
      overflow: hidden;
    }
    .roster-row-container:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .roster-row {
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      cursor: pointer;
    }
    .roster-primary {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 220px;
    }
    .roster-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      flex: 1;
      align-items: center;
    }
    .compact-skill-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-surface);
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.82rem;
    }
    .compact-skill-name {
      font-weight: 600;
      color: var(--text-primary);
    }
    .roster-expanded-details {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 1.25rem 1.5rem;
    }
    .expanded-skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.75rem 1.25rem;
      margin-top: 0.75rem;
    }
    @media (max-width: 1024px) {
      .students-layout {
        grid-template-columns: 1fr;
      }
      .filter-panel {
        position: static;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Left Navigation Rail (Injected by common.js) -->
    <div id="rail-container"></div>

    <!-- App Main Wrapper -->
    <div class="app-main-wrapper">
      <!-- Top Navigation Header (Injected by common.js) -->
      <div id="header-container"></div>

      <!-- Main Workspace -->
      <main class="main-content">
        <header class="panel-header" style="margin-bottom: 1.5rem;">
          <div>
            <h1 class="panel-title" style="font-size: 1.6rem; letter-spacing: -0.02em;">Find Students & Talent Roster</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem;">Discover skilled candidates across degree programs and evaluate verified competencies.</p>
          </div>
          <div>
            <button type="button" class="btn btn-primary" onclick="openAddStudentDrawer()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Student</span>
            </button>
          </div>
        </header>

        <div id="students-notice-area"></div>

        <!-- Layout: Sticky Filters Left + Roster Right -->
        <div class="students-layout">
          <!-- Filter Panel -->
          <aside class="filter-panel" aria-label="Search and filtering panel">
            <div class="panel-header" style="margin-bottom: 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-subtle);">
              <h2 class="panel-title" style="font-size: 1.05rem;">Search & Filters</h2>
              <button type="button" class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="resetFilters()">Reset</button>
            </div>

            <form id="filter-form" onsubmit="handleFilterSubmit(event)" novalidate>
              <!-- 1. Searchable Skill Picker -->
              <div class="form-group">
                <label for="skill-search-input" class="form-label">Required Skills</label>
                <div id="selected-skills-chips" class="skill-chips-container" style="display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem;"></div>
                <div class="skill-picker" style="position: relative;">
                  <input
                    type="text"
                    id="skill-search-input"
                    class="form-input"
                    placeholder="Type skill to add (e.g. Python)..."
                    autocomplete="off"
                  >
                  <div id="skill-dropdown" class="dropdown-panel" style="position: absolute; top: 100%; left: 0; right: 0; width: 100%;" role="listbox"></div>
                </div>
              </div>

              <!-- 2. Skill Match Logic -->
              <div class="form-group">
                <label class="form-label">Match Logic</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                  <button type="button" id="mode-or" class="btn btn-primary" style="padding: 0.45rem; font-size: 0.8rem;" onclick="setSkillMode('OR')">Any Skill (OR)</button>
                  <button type="button" id="mode-and" class="btn btn-secondary" style="padding: 0.45rem; font-size: 0.8rem;" onclick="setSkillMode('AND')">All Skills (AND)</button>
                </div>
              </div>

              <!-- 3. Cohort Year -->
              <div class="form-group">
                <label class="form-label">Cohort Year</label>
                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.35rem;">
                  <button type="button" class="btn btn-primary year-btn active" style="padding: 0.4rem 0; font-size: 0.8rem;" data-year="" onclick="setYearFilter('')">All</button>
                  <button type="button" class="btn btn-secondary year-btn" style="padding: 0.4rem 0; font-size: 0.8rem;" data-year="1" onclick="setYearFilter('1')">Y1</button>
                  <button type="button" class="btn btn-secondary year-btn" style="padding: 0.4rem 0; font-size: 0.8rem;" data-year="2" onclick="setYearFilter('2')">Y2</button>
                  <button type="button" class="btn btn-secondary year-btn" style="padding: 0.4rem 0; font-size: 0.8rem;" data-year="3" onclick="setYearFilter('3')">Y3</button>
                  <button type="button" class="btn btn-secondary year-btn" style="padding: 0.4rem 0; font-size: 0.8rem;" data-year="4" onclick="setYearFilter('4')">Y4</button>
                </div>
              </div>

              <!-- 4. Degree Program -->
              <div class="form-group">
                <label for="filter-course" class="form-label">Degree Program</label>
                <select id="filter-course" class="form-select">
                  <option value="">All programs</option>
                </select>
              </div>

              <!-- 5. Department -->
              <div class="form-group">
                <label for="filter-dept" class="form-label">Department</label>
                <select id="filter-dept" class="form-select">
                  <option value="">All departments</option>
                </select>
              </div>

              <!-- 6. Available Only Toggle -->
              <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 500; cursor: pointer;">
                  <input type="checkbox" id="filter-available" onchange="loadStudents()">
                  <span>Available for project matching only</span>
                </label>
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Apply Filters</button>
            </form>
          </aside>

          <!-- Right Roster List -->
          <section aria-label="Student records">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;">
              <div id="roster-count-label" class="num-tabular" style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 500;">
                Loading student roster...
              </div>

              <!-- Sort Dropdown -->
              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="sort-dropdown" class="form-label" style="margin-bottom: 0; font-size: 0.85rem;">Sort by:</label>
                <select id="sort-dropdown" class="form-select" onchange="sortAndRenderRoster()" style="width: auto; padding: 0.35rem 0.75rem; font-size: 0.85rem;">
                  <option value="name">Name (A–Z)</option>
                  <option value="year">Cohort year</option>
                  <option value="skills">Most skills</option>
                  <option value="match">Best match</option>
                </select>
              </div>
            </div>

            <div id="roster-container" class="roster-list">
              <!-- Skeletons -->
              <div class="skeleton-row"><div class="skeleton-bar" style="width: 25%;"></div><div class="skeleton-bar" style="width: 45%;"></div><div class="skeleton-bar" style="width: 15%;"></div></div>
              <div class="skeleton-row"><div class="skeleton-bar" style="width: 30%;"></div><div class="skeleton-bar" style="width: 35%;"></div><div class="skeleton-bar" style="width: 20%;"></div></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Student Slide Drawer -->
  <div id="add-drawer-backdrop" class="drawer-backdrop" onclick="closeAddStudentDrawer()">
    <aside id="add-drawer" class="drawer-panel" aria-label="Add student drawer" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem;">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">Add New Student</h2>
        <button type="button" class="btn btn-secondary" style="padding: 0.35rem 0.65rem;" onclick="closeAddStudentDrawer()">✕</button>
      </div>

      <form id="add-student-form" onsubmit="handleAddStudent(event)" novalidate>
        <div class="form-group">
          <label for="add-student-name" class="form-label">Full Name</label>
          <input type="text" id="add-student-name" class="form-input" placeholder="e.g. Maya Lin">
        </div>
        <div class="form-group">
          <label for="add-student-email" class="form-label">University Email</label>
          <input type="email" id="add-student-email" class="form-input" placeholder="maya.lin@univ.edu">
        </div>
        <div class="form-group">
          <label for="add-student-reg" class="form-label">Registration Number</label>
          <input type="text" id="add-student-reg" class="form-input" placeholder="e.g. 2024CS101">
        </div>
        <div class="form-group">
          <label for="add-student-course" class="form-label">Degree Program</label>
          <select id="add-student-course" class="form-select"></select>
        </div>
        <div class="form-group">
          <label for="add-student-year" class="form-label">Cohort Year</label>
          <select id="add-student-year" class="form-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 500; cursor: pointer;">
            <input type="checkbox" id="add-student-avail" checked>
            <span>Available for project matching</span>
          </label>
        </div>
        <div class="form-group">
          <label for="add-student-bio" class="form-label">Biography & Focus Areas</label>
          <textarea id="add-student-bio" class="form-textarea" rows="3" placeholder="Technical focus areas, research interests..."></textarea>
        </div>
        <div id="add-student-feedback" style="margin-bottom: 1rem;"></div>
        <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
          <button type="button" class="btn btn-secondary" onclick="closeAddStudentDrawer()">Cancel</button>
          <button type="submit" id="btn-create-student" class="btn btn-primary">Create Profile</button>
        </div>
      </form>
    </aside>
  </div>

  <script src="/app/js/common.js"></script>
  <script src="/app/js/students.js"></script>
</body>
</html>
