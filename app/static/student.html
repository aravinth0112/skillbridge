<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile – SkillBridge</title>
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
  <link rel="stylesheet" href="/app/css/style.css">
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .skill-card-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .skill-card-left {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 140px;
    }
    .skill-card-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--ink-navy);
    }
    .skill-card-cat {
      font-size: 0.82rem;
      color: var(--ink-muted);
    }
    @media (max-width: 900px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Left Navigation Rail -->
    <div id="rail-container"></div>

    <!-- Main Workspace -->
    <main class="main-content">
      <div style="margin-bottom: 1.25rem;">
        <a href="/app/students.html" class="btn btn-secondary btn-sm">Students</a>
      </div>

      <!-- Header (Zero Filler Subtitle) -->
      <header class="view-header">
        <div>
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem; flex-wrap: wrap;">
            <h1 id="profile-name" class="view-title">Loading student...</h1>
            <span id="profile-avail-pill" class="status-pill status-open">Available</span>
          </div>
          <div style="font-size: 0.88rem; color: var(--ink-muted);">
            <span id="profile-reg-header">Registration: Loading...</span>
          </div>
        </div>
        <div id="delete-student-area" style="display: flex; align-items: center; gap: 0.5rem;">
          <button type="button" id="btn-delete-student-trigger" class="btn btn-danger btn-sm" onclick="triggerDeleteStudentInline()">Delete student</button>
          <div id="delete-student-inline-container"></div>
        </div>
      </header>

      <div id="profile-global-notice"></div>

      <!-- Split Layout: Profile Details Left + Skills Portfolio Right -->
      <div class="profile-layout">
        <!-- Left: Student Details Form Panel -->
        <section class="panel" aria-label="Student details">
          <div class="panel-header">
            <h2 class="panel-title">Student details</h2>
          </div>

          <form id="student-edit-form" onsubmit="handleSaveStudent(event)" novalidate>
            <div class="form-group">
              <label for="edit-name" class="form-label">Full name</label>
              <input type="text" id="edit-name" class="form-input">
            </div>

            <div class="form-group">
              <label for="edit-email" class="form-label">University email</label>
              <input type="email" id="edit-email" class="form-input">
            </div>

            <div class="form-group">
              <label for="edit-reg" class="form-label">Registration number</label>
              <input type="text" id="edit-reg" class="form-input">
            </div>

            <div class="form-group">
              <label for="edit-course" class="form-label">Degree program</label>
              <select id="edit-course" class="form-select"></select>
            </div>

            <div class="form-group">
              <label for="edit-year" class="form-label">Cohort year</label>
              <select id="edit-year" class="form-select">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>

            <div class="form-group">
              <label class="switch-label">
                <input type="checkbox" id="edit-avail" style="display:none;">
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
                <span>Available for project match</span>
              </label>
            </div>

            <div class="form-group">
              <label for="edit-bio" class="form-label">Biography and interests</label>
              <textarea id="edit-bio" class="form-textarea" rows="4"></textarea>
            </div>

            <div id="profile-edit-feedback"></div>

            <button type="submit" id="btn-save-student" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
              Save student
            </button>
          </form>
        </section>

        <!-- Right: Skills & In-Place Clickable Gauges Panel -->
        <section class="panel" aria-label="Technical skills portfolio">
          <div class="panel-header">
            <h2 class="panel-title">Skills and proficiency</h2>
          </div>
          <p class="form-hint" style="margin-bottom: 1.25rem;">Click any segment to update level in place. Keyboard arrow keys supported.</p>

          <!-- Add Skill Inline Form -->
          <form id="add-skill-form" onsubmit="handleAddSkill(event)" style="background: var(--paper); border: 1px solid var(--border); padding: 1rem; margin-bottom: 1.5rem;" novalidate>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto 120px; gap: 0.85rem; align-items: flex-end;">
              <div class="form-group" style="margin-bottom: 0;">
                <label for="add-skill-select" class="form-label">Add skill</label>
                <select id="add-skill-select" class="form-select"></select>
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label for="add-skill-prof" class="form-label">Initial level</label>
                <select id="add-skill-prof" class="form-select">
                  <option value="1">1 - Beginner</option>
                  <option value="2">2 - Basic</option>
                  <option value="3" selected>3 - Intermediate</option>
                  <option value="4">4 - Advanced</option>
                  <option value="5">5 - Expert</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom: 0; padding-bottom: 0.6rem;">
                <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; cursor: pointer;">
                  <input type="checkbox" id="add-skill-verified"> Verified
                </label>
              </div>
              <div>
                <button type="submit" class="btn btn-primary btn-sm" style="width: 100%; height: 38px;">Map skill</button>
              </div>
            </div>
            <div id="add-skill-feedback"></div>
          </form>

          <!-- Skills Gauge List -->
          <div id="skills-ledger-container">
            <div class="skeleton-row"><div class="skeleton-bar" style="width: 35%;"></div><div class="skeleton-bar" style="width: 30%;"></div><div class="skeleton-bar" style="width: 15%;"></div></div>
            <div class="skeleton-row"><div class="skeleton-bar" style="width: 40%;"></div><div class="skeleton-bar" style="width: 25%;"></div><div class="skeleton-bar" style="width: 15%;"></div></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/app/js/common.js"></script>
  <script src="/app/js/student.js"></script>
</body>
</html>
