<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile – SkillBridge</title>
  <link rel="icon" type="image/svg+xml" href="/app/favicon.svg">
  <link rel="stylesheet" href="/app/css/style.css">
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.75rem;
      align-items: start;
    }
    .skill-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      transition: all var(--t-fast);
    }
    .skill-card-item:hover {
      border-color: var(--primary);
    }
    .skill-card-left {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 140px;
    }
    .skill-card-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
    }
    .skill-card-cat {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    @media (max-width: 900px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Left Navigation Rail (Injected by common.js) -->
    <div id="rail-container"></div>

    <!-- App Main Wrapper -->
    <div class="app-main-wrapper">
      <!-- Top Navigation Header (Injected by common.js) -->
      <div id="header-container"></div>

      <!-- Main Workspace -->
      <main class="main-content">
        <div style="margin-bottom: 1.25rem;">
          <a href="/app/students.html" class="btn btn-secondary" style="padding: 0.4rem 0.85rem; font-size: 0.82rem;">← Back to Talent Roster</a>
        </div>

        <!-- Profile Header Card -->
        <header class="card" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <div class="rail-avatar" style="width: 56px; height: 56px; font-size: 1.35rem; font-weight: 700;">
              SP
            </div>
            <div>
              <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; flex-wrap: wrap;">
                <h1 id="profile-name" class="panel-title" style="font-size: 1.6rem; letter-spacing: -0.02em;">Loading student...</h1>
                <span id="profile-avail-pill" class="badge badge-open">Available</span>
              </div>
              <div style="font-size: 0.88rem; color: var(--text-muted);">
                <span id="profile-reg-header">Registration: Loading...</span>
              </div>
            </div>
          </div>

          <div id="delete-student-area" style="display: flex; align-items: center; gap: 0.5rem;">
            <button type="button" id="btn-delete-student-trigger" class="btn btn-danger" style="padding: 0.45rem 0.85rem; font-size: 0.82rem;" onclick="triggerDeleteStudentInline()">Delete Student</button>
            <div id="delete-student-inline-container"></div>
          </div>
        </header>

        <div id="profile-global-notice"></div>

        <!-- Split Layout: Profile Details Left + Skills Portfolio Right -->
        <div class="profile-layout">
          <!-- Left: Student Details Form Panel -->
          <section class="card" aria-label="Student details">
            <div class="panel-header" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem; margin-bottom: 1.25rem;">
              <h2 class="panel-title" style="font-size: 1.1rem;">Personal & Academic Info</h2>
            </div>

            <form id="student-edit-form" onsubmit="handleSaveStudent(event)" novalidate>
              <div class="form-group">
                <label for="edit-name" class="form-label">Full Name</label>
                <input type="text" id="edit-name" class="form-input">
              </div>

              <div class="form-group">
                <label for="edit-email" class="form-label">University Email</label>
                <input type="email" id="edit-email" class="form-input">
              </div>

              <div class="form-group">
                <label for="edit-reg" class="form-label">Registration Number</label>
                <input type="text" id="edit-reg" class="form-input">
              </div>

              <div class="form-group">
                <label for="edit-course" class="form-label">Degree Program</label>
                <select id="edit-course" class="form-select"></select>
              </div>

              <div class="form-group">
                <label for="edit-year" class="form-label">Cohort Year</label>
                <select id="edit-year" class="form-select">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </div>

              <div class="form-group">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer; margin-top: 0.25rem;">
                  <input type="checkbox" id="edit-avail">
                  <span>Available for project matching</span>
                </label>
              </div>

              <div class="form-group">
                <label for="edit-bio" class="form-label">Biography & Focus Areas</label>
                <textarea id="edit-bio" class="form-textarea" rows="4"></textarea>
              </div>

              <div id="profile-edit-feedback"></div>

              <button type="submit" id="btn-save-student" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
                Save Changes
              </button>
            </form>
          </section>

          <!-- Right: Skills & In-Place Clickable Gauges Panel -->
          <section class="card" aria-label="Technical skills portfolio">
            <div class="panel-header" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem; margin-bottom: 0.75rem;">
              <h2 class="panel-title" style="font-size: 1.1rem;">Skills & Verified Proficiencies</h2>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.25rem;">Click any segment on the 5-segment meter to update proficiency in real-time.</p>

            <!-- Add Skill Inline Form -->
            <form id="add-skill-form" onsubmit="handleAddSkill(event)" style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.5rem;" novalidate>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto 130px; gap: 0.85rem; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0;">
                  <label for="add-skill-select" class="form-label">Add Skill to Profile</label>
                  <select id="add-skill-select" class="form-select"></select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                  <label for="add-skill-prof" class="form-label">Initial Proficiency</label>
                  <select id="add-skill-prof" class="form-select">
                    <option value="1">1 - Beginner</option>
                    <option value="2">2 - Basic</option>
                    <option value="3" selected>3 - Intermediate</option>
                    <option value="4">4 - Advanced</option>
                    <option value="5">5 - Expert</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom: 0; padding-bottom: 0.6rem;">
                  <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; cursor: pointer;">
                    <input type="checkbox" id="add-skill-verified">
                    <span>Verified</span>
                  </label>
                </div>
                <div>
                  <button type="submit" class="btn btn-primary" style="width: 100%; height: 40px; padding: 0.5rem;">Map Skill</button>
                </div>
              </div>
              <div id="add-skill-feedback"></div>
            </form>

            <!-- Skills Gauge List -->
            <div id="skills-ledger-container">
              <div class="skeleton-row"><div class="skeleton-bar" style="width: 35%;"></div><div class="skeleton-bar" style="width: 30%;"></div><div class="skeleton-bar" style="width: 15%;"></div></div>
              <div class="skeleton-row"><div class="skeleton-bar" style="width: 40%;"></div><div class="skeleton-bar" style="width: 25%;"></div><div class="skeleton-bar" style="width: 15%;"></div></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="/app/js/common.js"></script>
  <script src="/app/js/student.js"></script>
</body>
</html>
